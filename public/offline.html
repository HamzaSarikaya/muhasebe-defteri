<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f4">
  <title>Muhasebe</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#f2f2f4;color:#242427;font:16px/1.6 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:400px}h1{font-size:24px;line-height:1.35;letter-spacing:-.5px;font-weight:600}p{color:#66666f}button{margin-top:16px;min-height:44px;padding:12px 20px;touch-action:manipulation;border:1px solid #b8b8c0;border-radius:24px;background:#ffffff;color:#242427;font:inherit;cursor:pointer}button:active{background:#eeeeef}button:focus-visible{outline:2px solid #303034;outline-offset:4px}.brand{color:#66666f;font-size:13px}
  </style>
</head>
<body>
  <main><span class="brand">Muhasebe</span><h1 id="title">İnternet bağlantısı yok</h1><p id="description">Hesaplarınıza erişmek için yeniden bağlanın. Finansal bilgileriniz bu cihazda çevrimdışı saklanmaz.</p><button id="retry" type="button">Yeniden dene</button></main>
  <script>
    if (location.pathname === '/en' || location.pathname.startsWith('/en/')) {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'No internet connection';
      document.getElementById('description').textContent = 'Reconnect to access your accounts. Your financial information is not stored offline on this device.';
      document.getElementById('retry').textContent = 'Try again';
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  </script>
</body>
</html>
