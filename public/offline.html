<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <title>Muhasebe</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0b0f17;color:#f8fafc;font:14px/1.6 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:400px}h1{font-size:24px;line-height:1.35;letter-spacing:-.5px;font-weight:600}p{color:#94a3b8}button{margin-top:16px;padding:12px 20px;border:1px solid #2e3f59;border-radius:6px;background:#131924;color:#f8fafc;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #3b82f6;outline-offset:4px}.brand{color:#94a3b8;font-size:13px}
  </style>
</head>
<body>
  <main><span class="brand">Muhasebe</span><h1 id="title">İnternet bağlantısı yok</h1><p id="description">Hesaplarınıza erişmek için yeniden bağlanın. Finansal bilgileriniz bu cihazda çevrimdışı saklanmaz.</p><button id="retry" type="button">Yeniden dene</button></main>
  <script>
    if (location.pathname === '/en' || location.pathname.startsWith('/en/')) {
      document.documentElement.lang = 'en';
      document.getElementById('title').textContent = 'No internet connection';
      document.getElementById('description').textContent = 'Reconnect to access your accounts. Your financial information is not stored offline on this device.';
      document.getElementById('retry').textContent = 'Try again';
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  </script>
</body>
</html>
