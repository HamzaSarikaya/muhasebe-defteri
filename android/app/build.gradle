plugins { id 'com.android.application' }

def signingValues = ['STORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].collectEntries {
    [(it): System.getenv('MUHASEBE_SIGNING_' + it)]
}

android {
    namespace 'app.muhasebedefteri.android'
    compileSdk 36
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId 'app.muhasebedefteri.android'
        minSdk 24
        targetSdk 36
        versionCode 404
        versionName '0.4.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (signingValues.values().every { it }) {
                storeFile file(signingValues.STORE)
                storePassword signingValues.STORE_PASSWORD
                keyAlias signingValues.KEY_ALIAS
                keyPassword signingValues.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
